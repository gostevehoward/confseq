name: Build and publish wheels

on:
  pull_request:
    branches: [ master ]
  release:
    types: [ prereleased, released ]
  workflow_dispatch:

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build SDist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: confseq-sdist
        path: dist/confseq-*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm builds Linux aarch64 wheels; macos-latest (arm64)
        # builds both arm64 and x86_64 macOS wheels. Which Pythons and
        # architectures are built, and how wheels are tested, is configured
        # under [tool.cibuildwheel] in pyproject.toml.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Build and test wheels
      uses: pypa/cibuildwheel@v4.3.5
      env:
        MACOSX_DEPLOYMENT_TARGET: "11.0"

    - uses: actions/upload-artifact@v7
      with:
        name: confseq-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  publish:
    name: Publish Python distributions to PyPI and TestPyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Download sdist and wheels
      uses: actions/download-artifact@v8
      with:
        pattern: confseq-*
        path: dist
        merge-multiple: true
    - name: Publish distribution to Test PyPI
      if: github.event.action == 'prereleased'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
    - name: Publish distribution to PyPI
      if: github.event.action == 'released' && github.repository_owner == 'gostevehoward'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
